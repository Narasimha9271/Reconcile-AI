services:
  - type: web
    name: reconcileai-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: RECONCILEAI_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reconcileai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: reconcileai-db
    plan: free
    ipAllowList: []
