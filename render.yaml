services:
  - type: web
    name: reconcileai-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: RECONCILEAI_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reconcileai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GOOGLE_ALLOWED_EMAIL
        sync: false
      - key: GOOGLE_FINANCE_APPROVER_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
  - type: web
    name: reconcileai-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_HOSTPORT
        fromService:
          type: web
          name: reconcileai-api
          property: hostport
databases:
  - name: reconcileai-db
    plan: free
